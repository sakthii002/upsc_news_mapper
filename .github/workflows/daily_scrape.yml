name: Daily News Scrape

on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight UTC
  workflow_dispatch:      # Allows manual trigger

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install -r upsc_news_mapper/requirements.txt

      - name: Create data directory
        run: mkdir -p upsc_news_mapper/data

      - name: Run Scraper and Mapper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONPATH: ${{ github.workspace }}/upsc_news_mapper
        run: |
          python upsc_news_mapper/main.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add upsc_news_mapper/data/news_data.json
          git commit -m "Update daily news data [skip ci]" || echo "No changes to commit"
          git push
